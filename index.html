<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas Digital RW 25</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --secondary-color: #1e1b4b;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --warning-color: #f59e0b;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 50px;
      -webkit-font-smoothing: antialiased;
    }

    /* HEADER */
    .header {
      background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
      color: white;
      text-align: center;
      padding: 30px 20px;
      box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
      margin-bottom: 35px;
      border-bottom-left-radius: 20px;
      border-bottom-right-radius: 20px;
    }
    .header h1 { font-size: 28px; font-weight: 700; margin-bottom: 5px; letter-spacing: -0.5px; }
    .header p { font-size: 14px; font-weight: 300; opacity: 0.9; }

    .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }

    /* CARD DESIGN */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      margin-bottom: 30px;
      border: 1px solid var(--border-color);
    }

    /* FORM STYLE */
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 15px; }
    @media (max-width: 650px) { .form-grid-2 { grid-template-columns: 1fr; } }

    .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .form-group label { font-size: 14px; font-weight: 600; color: var(--text-main); }
    
    input, select {
      padding: 12px 16px;
      border: 2px solid var(--border-color);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-main);
      background-color: #f9fafb;
      transition: all 0.3s ease;
      outline: none;
    }
    input:focus, select:focus { border-color: var(--primary-color); background-color: #fff; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn-submit:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3); }

    /* TABLE SECTION */
    .rekap-header-block {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    @media (max-width: 650px) { .rekap-header-block { flex-direction: column; align-items: flex-start; gap: 10px; } }
    
    .section-title { font-size: 20px; font-weight: 700; color: var(--text-main); }
    .saldo-box { background: #e0e7ff; padding: 10px 20px; border-radius: 10px; border: 1px solid #c7d2fe; }
    .saldo-label { font-size: 16px; font-weight: 700; color: var(--primary-color); }

    .table-responsive { width: 100%; overflow-x: auto; border-radius: 10px; }
    table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; }
    th { background-color: #f1f5f9; color: var(--text-muted); font-weight: 600; padding: 15px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 15px; font-size: 14px; border-bottom: 1px solid var(--border-color); color: var(--text-main); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: #f8fafc; }

    /* BADGES */
    .badge { padding: 6px 12px; border-radius: 30px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }
    .badge-pemasukan { background-color: #d1fae5; color: #065f46; }
    .badge-pengeluaran { background-color: #fee2e2; color: #991b1b; }
    
    .text-pemasukan { color: var(--success-color); font-weight: 700; }
    .text-pengeluaran { color: var(--danger-color); font-weight: 700; }

    /* ACTION BUTTONS */
    .action-buttons { display: flex; gap: 8px; }
    .btn-action {
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 5px;
    }
    .btn-action:hover { transform: translateY(-2px); }
    .btn-detail { background-color: #f1f5f9; color: var(--text-muted); }
    .btn-detail:hover { background-color: #e2e8f0; color: var(--text-main); }
    .btn-edit { background-color: #fef3c7; color: #b45309; }
    .btn-edit:hover { background-color: #fde68a; }
    .btn-delete { background-color: #fee2e2; color: var(--danger-color); }
    .btn-delete:hover { background-color: #fecaca; }

    /* TOAST NOTIFICATION */
    #toast {
      visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center;
      border-radius: 10px; padding: 16px; position: fixed; z-index: 1000; right: 30px; bottom: 30px;
      font-size: 14px; font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transform: translateY(20px); opacity: 0; transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    #toast.show { visibility: visible; opacity: 1; transform: translateY(0); }
    #toast.success { background-color: var(--success-color); }
    #toast.error { background-color: var(--danger-color); }
    #toast.info { background-color: var(--primary-color); }
  </style>
</head>
<body>

  <div id="toast"><i class="fas fa-info-circle"></i> <span id="toast-msg">Pesan</span></div>

  <div class="header">
    <h1><i class="fas fa-wallet"></i> Kas Digital RW 25</h1>
    <p>Sistem Informasi Pengelolaan Keuangan Warga</p>
  </div>

  <div class="container">
    
    <div class="card">
      <form id="form-transaksi">
        <div class="form-grid-2">
          <div class="form-group">
            <label for="tanggal"><i class="far fa-calendar-alt"></i> Tanggal Transaksi</label>
            <input type="date" id="tanggal" required>
          </div>
          <div class="form-group">
            <label for="jenis"><i class="fas fa-exchange-alt"></i> Tipe Transaksi</label>
            <select id="jenis">
              <option value="pemasukan">Pemasukan (+)</option>
              <option value="pengeluaran">Pengeluaran (-)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="keterangan"><i class="fas fa-align-left"></i> Keterangan / Deskripsi</label>
          <input type="text" id="keterangan" placeholder="Contoh: Iuran Wajib Bulan April - Admin Budi" required autocomplete="off">
        </div>

        <div class="form-group">
          <label for="jumlah"><i class="fas fa-money-bill-wave"></i> Jumlah Nominal (Rp)</label>
          <input type="number" id="jumlah" placeholder="Contoh: 500000" required min="1">
        </div>

        <button type="submit" class="btn-submit" id="btn-submit-form">
          <i class="fas fa-save"></i> Simpan Transaksi Baru
        </button>
        <button type="button" class="btn-submit" id="btn-cancel-edit" style="display: none; background-color: var(--text-muted); margin-top: 10px;">
          <i class="fas fa-times"></i> Batal Edit
        </button>
      </form>
    </div>

    <div class="card">
      <div class="rekap-header-block">
        <div class="section-title"><i class="fas fa-list-alt"></i> Rekapitulasi Transaksi</div>
        <div class="saldo-box">
          <div class="saldo-label" id="total-saldo">Total Saldo: Rp 0</div>
        </div>
      </div>

      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Keterangan</th>
              <th>Tipe</th>
              <th>Jumlah</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-transaksi">
            </tbody>
        </table>
      </div>
    </div>

  </div>

  <script> 
    // PERHATIAN: GANTI DENGAN IP PUBLIC BACKEND AWS KAMU!
    const API = "http://54.80.235.97:8000"; 
    let currentEditId = null;

    // Fungsi menampilkan Toast Notification
    function showToast(message, type = "info") {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").innerText = " " + message;
      toast.className = "show " + type;
      
      let icon = "fa-info-circle";
      if(type === 'success') icon = "fa-check-circle";
      if(type === 'error') icon = "fa-exclamation-circle";
      toast.innerHTML = `<i class="fas ${icon}"></i> <span id="toast-msg"> ${message}</span>`;

      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
    }

    function formatRupiah(n) { 
      return "Rp " + Number(n).toLocaleString("id-ID"); 
    }

    // [READ] Menampilkan semua data
    async function loadTransaksi() { 
      try {
        const res = await fetch(API + "/transaksi"); 
        const data = await res.json(); 
        const tbody = document.getElementById("tabel-transaksi"); 
        
        tbody.innerHTML = ""; 
        let totalSaldo = 0;
        
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#64748b; padding:30px;">Belum ada data transaksi.</td></tr>`;
          document.getElementById("total-saldo").innerText = "Total Saldo: Rp 0";
          return;
        }

        data.forEach(function(t) { 
          let isPemasukan = t.jenis === "pemasukan";
          let badgeClass = isPemasukan ? "badge-pemasukan" : "badge-pengeluaran";
          let textClass = isPemasukan ? "text-pemasukan" : "text-pengeluaran";
          let prefix = isPemasukan ? "+ " : "- ";
          let iconBadge = isPemasukan ? "fa-arrow-down" : "fa-arrow-up";
          
          if (isPemasukan) totalSaldo += parseFloat(t.jumlah);
          else totalSaldo -= parseFloat(t.jumlah);

          tbody.innerHTML += `<tr>
            <td>${t.tanggal}</td>
            <td style="font-weight:500;">${t.keterangan}</td> 
            <td><span class="badge ${badgeClass}"><i class="fas ${iconBadge}"></i> ${t.jenis.toUpperCase()}</span></td>
            <td class="${textClass}">${prefix}${formatRupiah(t.jumlah)}</td>
            <td>
              <div class="action-buttons">
                <button class="btn-action btn-detail" onclick="lihatDetail(${t.id})" title="Detail"><i class="fas fa-eye"></i></button>
                <button class="btn-action btn-edit" onclick="siapkanEdit(${t.id})" title="Edit"><i class="fas fa-edit"></i></button>
                <button class="btn-action btn-delete" onclick="hapusTransaksi(${t.id})" title="Hapus"><i class="fas fa-trash-alt"></i></button>
              </div>
            </td>
          </tr>`; 
        }); 

        document.getElementById("total-saldo").innerText = "Total Saldo: " + formatRupiah(totalSaldo);
      } catch (err) {
        showToast("Gagal mengambil data dari server", "error");
      }
    } 

    // [READ DETAIL] Menampilkan detail
    async function lihatDetail(id) {
      try {
        const res = await fetch(`${API}/transaksi/${id}`);
        const data = await res.json();
        alert(`🔍 DETAIL TRANSAKSI\n\nID Transaksi: ${data.id}\nTanggal: ${data.tanggal}\nTipe: ${data.jenis.toUpperCase()}\nKeterangan: ${data.keterangan}\nNominal: ${formatRupiah(data.jumlah)}`);
      } catch (err) {
        showToast("Gagal memuat detail data", "error");
      }
    }

    // [UPDATE - Tahap 1] Menarik data ke Form
    async function siapkanEdit(id) {
      try {
        const res = await fetch(`${API}/transaksi/${id}`);
        const data = await res.json();
        
        document.getElementById("tanggal").value = data.tanggal;
        document.getElementById("keterangan").value = data.keterangan;
        document.getElementById("jenis").value = data.jenis;
        document.getElementById("jumlah").value = data.jumlah;
        
        currentEditId = id;
        
        const btnSubmit = document.getElementById("btn-submit-form");
        btnSubmit.innerHTML = `<i class="fas fa-sync-alt"></i> Update Transaksi`;
        btnSubmit.style.backgroundColor = "var(--warning-color)";
        
        document.getElementById("btn-cancel-edit").style.display = "flex";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        showToast("Gagal memuat data edit", "error");
      }
    }

    // [DELETE] Menghapus data
    async function hapusTransaksi(id) {
      if(confirm("⚠️ Apakah Anda yakin ingin menghapus data ini secara permanen?")) {
        try {
          await fetch(`${API}/transaksi/${id}`, { method: "DELETE" });
          showToast("Data berhasil dihapus!", "success");
          loadTransaksi(); 
        } catch (err) {
          showToast("Gagal menghapus data", "error");
        }
      }
    }

    // [CREATE & UPDATE - Tahap 2] Submit Form
    document.getElementById("form-transaksi").addEventListener("submit", async function(e) { 
      e.preventDefault(); 
      
      const body = { 
        tanggal: document.getElementById("tanggal").value, 
        keterangan: document.getElementById("keterangan").value, 
        jenis: document.getElementById("jenis").value, 
        jumlah: parseFloat(document.getElementById("jumlah").value) 
      }; 
      
      try {
        if (currentEditId === null) {
          await fetch(API + "/transaksi", { 
            method: "POST", 
            headers: { "Content-Type": "application/json" }, 
            body: JSON.stringify(body) 
          }); 
          showToast("Transaksi berhasil disimpan!", "success");
        } else {
          await fetch(`${API}/transaksi/${currentEditId}`, { 
            method: "PUT", 
            headers: { "Content-Type": "application/json" }, 
            body: JSON.stringify(body) 
          }); 
          showToast("Transaksi berhasil diupdate!", "success");
          batalkanEdit(); 
        }
        
        e.target.reset(); 
        loadTransaksi(); 
      } catch (err) {
        showToast("Gagal terhubung ke backend server AWS!", "error");
      }
    }); 

    document.getElementById("btn-cancel-edit").addEventListener("click", batalkanEdit);

    function batalkanEdit() {
      currentEditId = null;
      document.getElementById("form-transaksi").reset();
      
      const btnSubmit = document.getElementById("btn-submit-form");
      btnSubmit.innerHTML = `<i class="fas fa-save"></i> Simpan Transaksi Baru`;
      btnSubmit.style.backgroundColor = "var(--primary-color)";
      
      document.getElementById("btn-cancel-edit").style.display = "none";
    }

    // Inisialisasi
    loadTransaksi(); 
  </script> 
</body>
</html>
