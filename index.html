<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kas RW. Pro.</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-base: #000000;
      --bg-card: #1c1c1e; /* Warna card iOS Dark Mode */
      --bg-input: #2c2c2e;
      --text-main: #f5f5f7;
      --text-muted: #86868b;
      --accent-blue: #0A84FF; /* iOS Blue Dark Mode */
      --accent-green: #32d74b;
      --accent-red: #ff453a;
      --accent-orange: #ff9f0a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      padding-bottom: 80px;
      -webkit-font-smoothing: antialiased;
    }

    /* NAVBAR APPLE STYLE */
    .navbar {
      position: fixed;
      top: 0; width: 100%; height: 48px;
      background: rgba(28, 28, 30, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000; border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .navbar a { color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 500; letter-spacing: -0.2px; }

    /* HERO HEADER */
    .header {
      text-align: center;
      padding: 100px 20px 40px;
      animation: fadeInDown 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .header h1 { font-size: 48px; font-weight: 700; letter-spacing: -1.5px; margin-bottom: 8px; }
    .header p { font-size: 20px; color: var(--text-muted); font-weight: 400; letter-spacing: -0.5px; }
    .hero-saldo { font-size: 56px; font-weight: 300; letter-spacing: -2px; margin-top: 15px; background: linear-gradient(90deg, #fff, #86868b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .container { max-width: 900px; margin: 0 auto; padding: 0 20px; }

    /* CARD DESIGN (Glass/Premium look) */
    .card {
      background: var(--bg-card);
      border-radius: 24px;
      padding: 35px;
      margin-bottom: 30px;
      opacity: 0; transform: translateY(20px);
      animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.3s;
    }

    /* FORM INPUTS */
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
    @media (max-width: 600px) { .form-grid-2 { grid-template-columns: 1fr; } }
    
    input, select {
      width: 100%;
      padding: 16px 20px;
      background-color: var(--bg-input);
      border: 1px solid transparent;
      border-radius: 14px;
      font-size: 16px;
      color: var(--text-main);
      transition: all 0.3s ease;
      outline: none;
      margin-top: 5px;
      margin-bottom: 15px;
    }
    input::placeholder { color: var(--text-muted); }
    input:focus, select:focus { border-color: var(--accent-blue); background-color: #3a3a3c; }

    label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; padding-left: 5px; }

    /* BUTTONS */
    .btn-submit {
      width: 100%; padding: 16px;
      background-color: var(--accent-blue);
      color: white; border: none; border-radius: 14px;
      font-size: 17px; font-weight: 600;
      cursor: pointer; transition: transform 0.2s, filter 0.2s;
    }
    .btn-submit:active { transform: scale(0.97); filter: brightness(0.9); }
    .btn-cancel { background-color: var(--bg-input); color: var(--text-main); margin-top: 10px; }

    /* TABLE */
    .section-title { font-size: 24px; font-weight: 600; margin-bottom: 25px; letter-spacing: -0.5px; }
    
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { color: var(--text-muted); font-size: 12px; text-transform: uppercase; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); font-weight: 600; }
    td { padding: 20px 10px; font-size: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    tr:last-child td { border-bottom: none; }
    
    /* PILL BADGES */
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
    .b-pemasukan { background: rgba(50, 215, 75, 0.15); color: var(--accent-green); }
    .b-pengeluaran { background: rgba(255, 69, 58, 0.15); color: var(--accent-red); }

    /* ACTION BUTTONS */
    .action-group { display: flex; gap: 8px; }
    .icon-btn {
      background: var(--bg-input); color: var(--text-main);
      border: none; border-radius: 50%; width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s; font-size: 12px;
    }
    .icon-btn:hover { background: #48484a; }
    .i-edit:hover { color: var(--accent-orange); }
    .i-delete:hover { color: var(--accent-red); }

    /* TOAST (Pill style Apple) */
    #toast {
      position: fixed; top: -60px; left: 50%; transform: translateX(-50%);
      background: rgba(44, 44, 46, 0.9); backdrop-filter: blur(10px);
      color: white; padding: 12px 24px; border-radius: 30px;
      font-size: 14px; font-weight: 500; z-index: 2000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    #toast.show { top: 70px; }

    /* ANIMATIONS */
    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInDown { 
      0% { opacity: 0; transform: translateY(-20px); } 
      100% { opacity: 1; transform: translateY(0); } 
    }
  </style>
</head>
<body>

  <div id="toast"><i class="fas fa-info-circle"></i> <span id="toast-msg">Pesan</span></div>

  <nav class="navbar">
    <a href="#"><i class="fas fa-wallet"></i> Kas Digital RW 25</a>
  </nav>

  <div class="header">
    <h1>Kas RW</h1>
    <p>Pengelolaan keuangan warga tingkat lanjut.</p>
    <div class="hero-saldo" id="total-saldo">Rp 0</div>
  </div>

  <div class="container">
    
    <div class="card">
      <h2 class="section-title">Transaksi Baru</h2>
      <form id="form-transaksi">
        <div class="form-grid-2">
          <div>
            <label>Tanggal</label>
            <input type="date" id="tanggal" required>
          </div>
          <div>
            <label>Tipe</label>
            <select id="jenis">
              <option value="pemasukan">Pemasukan (+)</option>
              <option value="pengeluaran">Pengeluaran (-)</option>
            </select>
          </div>
        </div>

        <div>
          <label>Keterangan</label>
          <input type="text" id="keterangan" placeholder="Contoh: Iuran Keamanan Bulan Ini" required autocomplete="off">
        </div>

        <div>
          <label>Jumlah Nominal (Rp)</label>
          <input type="number" id="jumlah" placeholder="500000" required min="1">
        </div>

        <button type="submit" class="btn-submit" id="btn-submit-form">Simpan Transaksi</button>
        <button type="button" class="btn-submit btn-cancel" id="btn-cancel-edit" style="display: none;">Batalkan</button>
      </form>
    </div>

    <div class="card" style="animation-delay: 0.5s;">
      <h2 class="section-title">Riwayat.</h2>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Keterangan</th>
              <th>Tipe</th>
              <th>Nominal</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-transaksi">
            </tbody>
        </table>
      </div>
    </div>

  </div>

  <script> 
    // PERHATIAN: JANGAN LUPA GANTI IP INI DENGAN IP PUBLIC BACKEND AWS KAMU!
    const API = "http://54.162.114.151:8000"; 
    let currentEditId = null;

    // Toast Notification mirip iOS
    function showToast(message) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-msg").innerText = " " + message;
      toast.classList.add("show");
      setTimeout(() => { toast.classList.remove("show"); }, 3000);
    }

    function formatRupiah(n) { 
      return "Rp " + Number(n).toLocaleString("id-ID"); 
    }

    // READ
    async function loadTransaksi() { 
      try {
        const res = await fetch(API + "/transaksi"); 
        const data = await res.json(); 
        const tbody = document.getElementById("tabel-transaksi"); 
        
        tbody.innerHTML = ""; 
        let totalSaldo = 0;
        
        if (data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:var(--text-muted);">Belum ada riwayat transaksi.</td></tr>`;
          document.getElementById("total-saldo").innerText = "Rp 0";
          return;
        }

        data.forEach(function(t) { 
          let isPemasukan = t.jenis === "pemasukan";
          let badgeClass = isPemasukan ? "b-pemasukan" : "b-pengeluaran";
          let warnaAngka = isPemasukan ? "var(--text-main)" : "var(--accent-red)";
          let prefix = isPemasukan ? "" : "- ";
          
          if (isPemasukan) totalSaldo += parseFloat(t.jumlah);
          else totalSaldo -= parseFloat(t.jumlah);

          tbody.innerHTML += `<tr>
            <td style="color: var(--text-muted); font-size: 13px;">${t.tanggal}</td>
            <td style="font-weight: 500;">${t.keterangan}</td> 
            <td><span class="badge ${badgeClass}">${t.jenis}</span></td>
            <td style="font-weight: 600; color: ${warnaAngka}">${prefix}${formatRupiah(t.jumlah)}</td>
            <td>
              <div class="action-group">
                <button class="icon-btn" onclick="lihatDetail(${t.id})" title="Detail"><i class="fas fa-eye"></i></button>
                <button class="icon-btn i-edit" onclick="siapkanEdit(${t.id})" title="Edit"><i class="fas fa-pencil-alt"></i></button>
                <button class="icon-btn i-delete" onclick="hapusTransaksi(${t.id})" title="Hapus"><i class="fas fa-trash"></i></button>
              </div>
            </td>
          </tr>`; 
        }); 

        document.getElementById("total-saldo").innerText = formatRupiah(totalSaldo);
      } catch (err) {
        showToast("Gagal mengambil data riwayat.");
      }
    } 

    // DETAIL
    async function lihatDetail(id) {
      try {
        const res = await fetch(`${API}/transaksi/${id}`);
        const data = await res.json();
        alert(`DETAIL TRANSAKSI\n\nID: ${data.id}\nTanggal: ${data.tanggal}\nTipe: ${data.jenis}\nKeterangan: ${data.keterangan}\nNominal: ${formatRupiah(data.jumlah)}`);
      } catch (err) {
        showToast("Gagal memuat detail data.");
      }
    }

    // SIAPKAN EDIT
    async function siapkanEdit(id) {
      try {
        const res = await fetch(`${API}/transaksi/${id}`);
        const data = await res.json();
        
        document.getElementById("tanggal").value = data.tanggal;
        document.getElementById("keterangan").value = data.keterangan;
        document.getElementById("jenis").value = data.jenis;
        document.getElementById("jumlah").value = data.jumlah;
        
        currentEditId = id;
        
        const btnSubmit = document.getElementById("btn-submit-form");
        btnSubmit.innerText = "Perbarui Transaksi";
        btnSubmit.style.backgroundColor = "var(--accent-orange)";
        
        document.getElementById("btn-cancel-edit").style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        showToast("Gagal memuat data edit.");
      }
    }

    // DELETE
    async function hapusTransaksi(id) {
      if(confirm("Hapus data ini secara permanen?")) {
        try {
          await fetch(`${API}/transaksi/${id}`, { method: "DELETE" });
          showToast("Data dihapus.");
          loadTransaksi(); 
        } catch (err) {
          showToast("Gagal menghapus data.");
        }
      }
    }

    // CREATE & UPDATE
    document.getElementById("form-transaksi").addEventListener("submit", async function(e) { 
      e.preventDefault(); 
      
      const body = { 
        tanggal: document.getElementById("tanggal").value, 
        keterangan: document.getElementById("keterangan").value, 
        jenis: document.getElementById("jenis").value, 
        jumlah: parseFloat(document.getElementById("jumlah").value) 
      }; 
      
      try {
        if (currentEditId === null) {
          await fetch(API + "/transaksi", { 
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) 
          }); 
          showToast("Transaksi disimpan.");
        } else {
          await fetch(`${API}/transaksi/${currentEditId}`, { 
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) 
          }); 
          showToast("Transaksi diperbarui.");
          batalkanEdit(); 
        }
        
        e.target.reset(); 
        loadTransaksi(); 
      } catch (err) {
        showToast("Koneksi ke server gagal.");
      }
    }); 

    // BATALKAN EDIT
    document.getElementById("btn-cancel-edit").addEventListener("click", batalkanEdit);

    function batalkanEdit() {
      currentEditId = null;
      document.getElementById("form-transaksi").reset();
      
      const btnSubmit = document.getElementById("btn-submit-form");
      btnSubmit.innerText = "Simpan Transaksi";
      btnSubmit.style.backgroundColor = "var(--accent-blue)";
      document.getElementById("btn-cancel-edit").style.display = "none";
    }

    // LOAD AWAL
    loadTransaksi(); 
  </script> 
</body>
</html>
